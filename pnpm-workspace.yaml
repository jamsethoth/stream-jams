packages:
  - "apps/*"
  - "packages/*"
nodeVersion: 24.16.0
engineStrict: true
runtimeOnFail: download
overrides:
  # SWC 1.16.13 rejects the shared cache permissions used by CI containers.
  '@swc/core': 1.15.41
  # Keep patched archive checks across the dependency graph.
  'tar@<7.5.21': 7.5.21
  'baseline-browser-mapping@>=2.0.0 <2.11.0': 2.11.0
  'browserslist@<=4.28.6': 4.28.7
  'brace-expansion@<1.1.21': 1.1.21
  'brace-expansion@>=3.0.0 <5.0.12': 5.0.12
  'fast-uri@>=3.0.0 <3.1.8': 3.1.8
  'find-my-way@<=9.6.0': 9.7.0
  'joi@>=17.0.0 <17.13.7': 17.13.7
  'joi@>=18.0.0 <18.2.6': 18.2.6
  'js-yaml@<3.15.2': 3.15.2
  'postcss@<=8.5.17': 8.5.25
  'undici@>=7.0.0 <7.29.1': 7.29.1
  'uuid@<11.1.1': 11.1.1
  'http-cache-semantics@<4.3.0': 4.3.0
  'ip-address@<10.7.1': 10.7.1
allowBuilds:
  electron: true
  '@swc/core': true
  # Jest's haste map uses Parcel's native watcher. Its reviewed install script
  # only rebuilds locally when npm_config_build_from_source is explicitly true.
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true
onlyBuiltDependencies:
  - electron
  - '@swc/core'
  - '@parcel/watcher'
  - esbuild
  - unrs-resolver
minimumReleaseAgeExclude:
  - http-cache-semantics@4.3.0
