packages:
  - "apps/*"
  - "packages/*"
nodeVersion: 24.16.0
engineStrict: true
runtimeOnFail: download
overrides:
  # Forge 7's rebuild pins a Git URL; use Electron's published equivalent while
  # retaining pnpm's blockExoticSubdeps protection.
  '@electron/rebuild@3.7.2>@electron/node-gyp': 10.2.0-electron.2
  # Backport Electron's own extractor replacement (packager#1917) without the
  # hook API changes in Packager 19+. Node 24 supports its ESM default export.
  '@electron/packager@18.4.4>extract-zip': npm:@electron-internal/extract-zip@1.0.5
  # Forge's rebuild/node-gyp chain requests unmaintained tar 6. Keep its
  # extraction API while including the patched archive security checks.
  'tar@<7.5.21': 7.5.21
  'baseline-browser-mapping@>=2.0.0 <2.11.0': 2.11.0
  'browserslist@<=4.28.6': 4.28.7
  'brace-expansion@<1.1.18': 1.1.18
  'brace-expansion@>=3.0.0 <5.0.9': 5.0.9
  'fast-uri@>=3.0.0 <3.1.6': 3.1.6
  'find-my-way@<=9.6.0': 9.7.0
  'joi@>=17.0.0 <17.13.6': 17.13.6
  'joi@>=18.0.0 <18.2.5': 18.2.5
  'js-yaml@<3.15.2': 3.15.2
  'postcss@<=8.5.17': 8.5.25
  'undici@>=7.0.0 <7.29.0': 7.29.0
  'uuid@<11.1.1': 11.1.1
allowBuilds:
  electron: true
  '@swc/core': true
  # Jest's haste map uses Parcel's native watcher. Its reviewed install script
  # only rebuilds locally when npm_config_build_from_source is explicitly true.
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true
onlyBuiltDependencies:
  - electron
  - '@swc/core'
  - '@parcel/watcher'
  - esbuild
  - unrs-resolver
