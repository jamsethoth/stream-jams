packages:
  - "apps/*"
  - "packages/*"
nodeVersion: 24.16.0
engineStrict: true
runtimeOnFail: download
overrides:
  # Jest 30.5 rejects Storybook's module.register() loader hook before stories run.
  # Retain the working runtime until Storybook supports that Jest restriction.
  'jest-runtime': 30.4.2
  # The sprintf-js <=1.1.3 denial-of-service advisory has no patched release. electron-builder only
  # reaches it through @electron/get's optional proxy agent, which a
  # prepackaged installer build never uses to download Electron.
  '@electron/get@3>global-agent': '-'
  # GHSA-68fv-2mgg-jv7q: validate indexed source-map offsets.
  'source-map-js@<1.2.2': 1.2.2
  # This consumer uses only YAML load(); v4 removes the unpatched sprintf CLI chain.
  '@istanbuljs/load-nyc-config>js-yaml': 4.3.2
  # SWC 1.16.13 rejects the shared cache permissions used by CI containers.
  '@swc/core': 1.15.41
  # Keep patched archive checks across the dependency graph.
  'tar@<7.5.21': 7.5.21
  'baseline-browser-mapping@>=2.0.0 <2.11.0': 2.11.0
  'browserslist@<=4.28.6': 4.28.7
  'brace-expansion@<1.1.21': 1.1.21
  'brace-expansion@>=3.0.0 <5.0.12': 5.0.12
  'fast-uri@>=3.0.0 <3.1.8': 3.1.8
  'find-my-way@<=9.6.0': 9.7.0
  'joi@>=17.0.0 <17.13.8': 17.13.8
  'joi@>=18.0.0 <18.2.9': 18.2.9
  'js-yaml@<3.15.2': 3.15.2
  'postcss@<=8.5.17': 8.5.25
  'undici@>=7.0.0 <7.29.1': 7.29.1
  'uuid@<11.1.1': 11.1.1
  'http-cache-semantics@<4.3.0': 4.3.0
  'ip-address@<10.7.1': 10.7.1
allowBuilds:
  electron: true
  '@swc/core': true
  # Jest's haste map uses Parcel's native watcher. Its reviewed install script
  # only rebuilds locally when npm_config_build_from_source is explicitly true.
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true
  # Pulled in by electron-builder's Squirrel target, which Stream Jams does not
  # use. Its reviewed install script only copies the vendored 7-Zip binary for
  # the host architecture to vendor/7z.exe.
  electron-winstaller: true
onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - '@swc/core'
  - '@parcel/watcher'
  - esbuild
  - unrs-resolver
minimumReleaseAgeExclude:
  - http-cache-semantics@4.3.0
  - '@mantine/core@9.7.0'
  - '@mantine/hooks@9.7.0'
