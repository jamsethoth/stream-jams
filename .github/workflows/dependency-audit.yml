name: Dependency Audit

on:
  pull_request:
    paths:
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/dependency-audit.yml'
      - 'scripts/dependency-audit*'
  push:
    branches: [main]
    paths:
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/dependency-audit.yml'
      - 'scripts/dependency-audit*'
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pnpm-audit:
    name: pnpm-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.2.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.16.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        id: audit
        run: pnpm audit:dependencies

      - name: Write audit summary
        if: always()
        run: |
          {
            echo "## pnpm audit"
            echo
            echo "- Command: \`pnpm audit:dependencies\` (native moderate-severity JSON audit plus strict evaluator)"
            echo "- Step outcome: \`${{ steps.audit.outcome }}\`"
            echo
            echo "Moderate, high and critical advisories and registry failures block this workflow. No advisory exceptions are accepted."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pnpm-audit-report
          path: pnpm-audit.json
          if-no-files-found: error
