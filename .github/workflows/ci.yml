name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit:dependencies

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
      - name: Upload validation dependency audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-dependency-audit
          path: pnpm-audit.json
          if-no-files-found: ignore
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  storybook:
    name: storybook
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Trust checkout for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm --filter @stream-jams/web build-storybook

      - name: Test Storybook
        run: pnpm --filter @stream-jams/web test-storybook:ci
        env:
          CI: true

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Playwright tests
        run: pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  desktop-package:
    name: windows-desktop-package
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      artifact-name: ${{ steps.portable-desktop-metadata.outputs.artifact-name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Package unsigned Windows folder
        run: pnpm desktop:package
      - name: Prepare portable desktop artifact
        id: portable-desktop-metadata
        run: node scripts/portable-desktop-artifact.mjs prepare
      - name: Upload built portable desktop artifact (not desktop-test-verified)
        id: portable-desktop-artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.portable-desktop-metadata.outputs.artifact-name }}
          path: apps/desktop/out/Stream Jams-win32-x64/
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false
      - name: Record portable desktop artifact
        env:
          STREAM_JAMS_PORTABLE_ARTIFACT_NAME: ${{ steps.portable-desktop-metadata.outputs.artifact-name }}
          STREAM_JAMS_PORTABLE_ARTIFACT_URL: ${{ steps.portable-desktop-artifact.outputs.artifact-url }}
          STREAM_JAMS_PORTABLE_ARTIFACT_DIGEST: ${{ steps.portable-desktop-artifact.outputs.artifact-digest }}
        run: node scripts/portable-desktop-artifact.mjs summarize

  desktop:
    name: windows-desktop
    # Test the published package on every CI run; publication remains independent.
    needs: desktop-package
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build test dependencies
        run: pnpm build
      - name: Download the published package
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.desktop-package.outputs.artifact-name }}
          path: apps/desktop/out/Stream Jams-win32-x64/
      - name: Verify isolated packaged runtime
        run: pnpm test:desktop
        env:
          CI: true
      - name: Upload desktop failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-test-results
          path: test-results/
          retention-days: 7

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      # Code scanning is unavailable for this private repository, so results stay in the run.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: codeql-results

      - name: Gate CodeQL findings
        run: node scripts/codeql-sarif-gate.mjs codeql-results .github/codeql-exceptions.json

      - name: Upload CodeQL results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-results
          path: codeql-results/
          if-no-files-found: warn
          retention-days: 14

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    # GitHub's dependency review needs Advanced Security on private repositories, so pull
    # requests run the same strict registry audit as the Dependency Audit workflow.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit:dependencies

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-review-audit
          path: pnpm-audit.json
          if-no-files-found: warn
          retention-days: 14
