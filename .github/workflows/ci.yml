name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  storybook:
    name: storybook
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
      options: --ipc=host

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm --filter @stream-jams/web build-storybook

      - name: Test Storybook
        run: pnpm --filter @stream-jams/web test-storybook:ci
        env:
          CI: true

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
      options: --ipc=host

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Playwright tests
        run: pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  desktop:
    name: windows-desktop
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Package unsigned Windows folder
        run: pnpm desktop:package
      - name: Verify isolated packaged runtime
        run: pnpm test:desktop
        env:
          CI: true
      - name: Prepare portable desktop artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: portable-desktop-metadata
        run: node scripts/portable-desktop-artifact.mjs prepare
      - name: Upload verified portable desktop artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: portable-desktop-artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.portable-desktop-metadata.outputs.artifact-name }}
          path: apps/desktop/out/Stream Jams-win32-x64/
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false
      - name: Record portable desktop artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          STREAM_JAMS_PORTABLE_ARTIFACT_NAME: ${{ steps.portable-desktop-metadata.outputs.artifact-name }}
          STREAM_JAMS_PORTABLE_ARTIFACT_URL: ${{ steps.portable-desktop-artifact.outputs.artifact-url }}
          STREAM_JAMS_PORTABLE_ARTIFACT_DIGEST: ${{ steps.portable-desktop-artifact.outputs.artifact-digest }}
        run: node scripts/portable-desktop-artifact.mjs summarize
      - name: Upload desktop failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-test-results
          path: test-results/
          retention-days: 7

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
